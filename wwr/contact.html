<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Go with The Float.Co </title>
    <meta name="description" content="Contact Go with the float Co company,for rafting information, rafting reservation and general inquiries ">
    <meta name="author" content="Irene Arnold">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Go with the float .Co</h1>

        <h2>Send Us a Message</h2>

        <p>Go with The Float.Co</p>
        <p>702 Rio Cararay, Tungurahua, Ecuador</p>
        <p>Phone: 608-525-9895</p>
        <p>Email:gowiththefloat.co@gmail.com</p>
        <div class="contact-grid">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!3m2!1sen!2sus!4v1795815838511!5m2!1sen!2sus!6m8!1m7!1sXplyMqC1R4T-iffl-Hf9gg!2m2!1d-1.396304099750237!2d-78.40654681497838!3f169.14395658707468!4f0!5f0.7820865974627469"  allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">  
                </iframe>
            </div>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="your@gmail.com" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" id="general" name="purpose" value="general" required> General Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Type your message here..." required></textarea>
                
                <label>
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-list">
                <figure>
                    <img src="images/employee1.jpg" alt=" Korey Arnold ">
                    <figcaption>Korey Arnold - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Gregory Mantuano">
                    <figcaption>Gregory Mantuano - Safety Director</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Christian Martinez">
                    <figcaption>Christian Martinez - Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Go with The Float.Co | Irene Arnold</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook "></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn "></a>
            <a href="https://instagram.com"><img src="images/instagram.jpg" alt="Instagram "></a>
        </nav>
    </footer>
</body>

</html>
